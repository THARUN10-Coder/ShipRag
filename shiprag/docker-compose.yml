version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - ingestion
      - retrieval

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shiprag
      POSTGRES_PASSWORD: shiprag_password
      POSTGRES_MULTIPLE_DATABASES: shiprag_auth,shiprag_chunks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgresql://shiprag:shiprag_password@postgres:5432/shiprag_auth
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      - postgres

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/raw
      AUTH_SERVICE_URL: http://auth:8001
    volumes:
      - raw_data:/data/raw
    depends_on:
      - redis
      - auth

  embedding:
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://shiprag:shiprag_password@postgres:5432/shiprag_chunks
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - raw_data:/data/raw
    depends_on:
      - redis
      - postgres

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    environment:
      DATABASE_URL: postgresql://shiprag:shiprag_password@postgres:5432/shiprag_chunks
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - redis
      - postgres
      - auth

volumes:
  postgres_data:
  redis_data:
  raw_data:
