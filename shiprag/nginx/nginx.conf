events {}

http {
    upstream auth_service {
        server auth:8001;
    }

    upstream ingestion_service {
        server ingestion:8002;
    }

    upstream retrieval_service {
        server retrieval:8004;
    }

    server {
        listen 8080;

        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ingest {
            proxy_pass http://ingestion_service/api/ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ingest/status/ {
            proxy_pass http://ingestion_service/api/ingest/status/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /webhook/github {
            proxy_pass http://ingestion_service/webhook/github;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/query {
            proxy_pass http://retrieval_service/api/query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Streaming SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }
    }
}
